name: Discord archive

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discord-sheets-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Monthly repository activity
        shell: bash
        run: |
          month=$(date -u +%Y-%m)
          if [[ ! -f .keepalive ]] || [[ "$(cat .keepalive)" != "$month" ]]; then
            printf '%s\n' "$month" > .keepalive
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .keepalive
            git commit -m 'chore: monthly archive keepalive'
            git pull --rebase origin '${{ github.event.repository.default_branch }}'
            git push origin 'HEAD:${{ github.event.repository.default_branch }}'
          fi
      - uses: actions/setup-python@v5
        if: ${{ !cancelled() }}
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        if: ${{ !cancelled() }}
        run: python -m pip install -r requirements.txt
      - name: Archive messages
        if: ${{ !cancelled() }}
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_IDS: ${{ secrets.CHANNEL_IDS }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python archive.py
