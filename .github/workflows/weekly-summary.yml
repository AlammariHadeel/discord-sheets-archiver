name: Weekly Discord summary
on:
  schedule:
    - cron: '0 18 * * 5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate preview in Sheets without posting to Discord'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: discord-sheets-archive
  cancel-in-progress: false
jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Generate and deliver weekly summary
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_IDS: ${{ secrets.CHANNEL_IDS }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUMMARY_CHANNEL_ID: '1562289264190951485'
          GEMINI_MODEL: gemini-3.1-flash-lite
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: python weekly_summary.py
